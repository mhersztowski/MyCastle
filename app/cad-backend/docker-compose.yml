services:
  cad:
    build:
      context: ../..
      dockerfile: app/cad-backend/Dockerfile
    environment:
      - CAD_BACKEND_PORT=1892
      - CAD_DATA_DIR=/data
    ports:
      - "1892:1892"
    volumes:
      - /opt/cad-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1892/api/vfs/capabilities').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
