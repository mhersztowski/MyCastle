<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Editor</title>
    <!-- Standalone viewer pages (/viewer/*) size themselves with height:100%,
         which collapses to 0 unless the mount chain has a concrete height.
         The editor uses 100dvh so it worked regardless; the viewers did not. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      /* ConfigProvider (ui-core) wraps the app in a bare div carrying its CSS
         custom properties; without a height it collapses and the viewers'
         height:100% resolves to 0. */
      #root > div { height: 100%; }
    </style>
    <!-- Polyfill crypto.randomUUID — dostępne natywnie tylko w bezpiecznym
         kontekście (HTTPS lub localhost). Przy dostępie przez LAN po zwykłym
         HTTP (np. z telefonu: http://192.168.x.x:1898) jest undefined, co
         wywalało aplikację (core-cad/Scene3D generują tu UUID) → pusta strona.
         getRandomValues działa też w nie-bezpiecznym kontekście, więc fallback
         daje poprawne UUID v4. Musi wykonać się PRZED modułami aplikacji. -->
    <script>
      (function () {
        var c = window.crypto || window.msCrypto;
        if (c && typeof c.randomUUID !== 'function' && typeof c.getRandomValues === 'function') {
          c.randomUUID = function () {
            var b = c.getRandomValues(new Uint8Array(16));
            b[6] = (b[6] & 0x0f) | 0x40; // wersja 4
            b[8] = (b[8] & 0x3f) | 0x80; // wariant
            var h = [];
            for (var i = 0; i < 256; i++) h[i] = (i + 0x100).toString(16).slice(1);
            return (
              h[b[0]] + h[b[1]] + h[b[2]] + h[b[3]] + '-' +
              h[b[4]] + h[b[5]] + '-' + h[b[6]] + h[b[7]] + '-' +
              h[b[8]] + h[b[9]] + '-' +
              h[b[10]] + h[b[11]] + h[b[12]] + h[b[13]] + h[b[14]] + h[b[15]]
            );
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
